<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <meta name="description" content="The Moth Collector — a collection of things that once lived.">
    <title>The Moth Collector</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/projects.js" defer></script>
    <script src="js/moths.js" defer></script>
    <script src="js/filters.js" defer></script>
    <script src="js/main.js" defer></script>
</head>
<body>
    <main class="world" aria-label="The Moth Collector portfolio">
        <header class="masthead">
            <span class="wordmark" aria-hidden="true"></span>
            <button class="search-toggle" type="button" aria-label="Open collection search" aria-expanded="false">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="10.8" cy="10.8" r="6.4"></circle>
                    <path d="m15.5 15.5 4.2 4.2"></path>
                </svg>
                <span class="visually-hidden">Search projects</span>
            </button>
            <section class="search-form" aria-labelledby="classification-title" hidden>
                <header class="classification-header">
                    <div>
                        <h2 id="classification-title">CLASSIFICATION</h2>
                    </div>
                    <button class="classification-close" type="button" aria-label="Close specimen classification">×</button>
                </header>
                <label class="visually-hidden" for="collection-search">Search specimens</label>
                <input id="collection-search" type="search" placeholder="Search specimens..." autocomplete="off">
                <fieldset class="tag-classification">
                    <legend>CLASSIFY BY TAG</legend>
                    <div class="tag-filters"></div>
                </fieldset>
                <label class="logic-toggle">
                    <input class="logic-and" type="checkbox">
                    <span>Require every selected tag <span class="logic-note">(AND)</span></span>
                </label>
                <div class="classification-footer">
                    <p class="filter-results" aria-live="polite"></p>
                    <button class="clear-filters" type="button">Clear filters</button>
                </div>
            </section>
        </header>

        <div class="living-view" id="living-view">
            <section class="specimen-room" aria-label="A character's face covered by living moths">
                <figure class="keeper">
                    <img src="assets/character/keeper.svg" alt="Placeholder character illustration">
                    <div class="moth-field" aria-label="Living moths"></div>
                </figure>
            </section>

            <nav class="collection-nav" aria-label="Portfolio views">
                <button class="collection-link is-selected" type="button" data-collection="living" aria-label="Return to living moths" title="Living moths" aria-pressed="true">
                    <span aria-hidden="true">◉</span>
                </button>
                <button class="collection-link" type="button" data-collection="dead" aria-label="Open Collection" title="Collection" aria-pressed="false">
                    <span aria-hidden="true">▤</span>
                </button>
                <button class="collection-link" type="button" data-collection="about" aria-label="About this portfolio" title="About" aria-pressed="false">
                    <span aria-hidden="true">i</span>
                </button>
            </nav>
            <p class="visually-hidden collection-note" aria-live="polite"></p>
        </div>

        <section class="dead-collection-view" id="dead-collection-view" aria-labelledby="collection-title" hidden>
            <header class="dead-collection-header">
                <h1 id="collection-title">Collection</h1>
                <p class="collection-progress" aria-label="Collection progress" aria-live="polite"><span class="collected-count">0</span> / <span class="total-count">8</span></p>
            </header>
            <div class="specimen-archive" aria-label="Collected and undiscovered specimens"></div>
            <button class="resurrect-all" type="button">Reset collection</button>
            <button class="return-living" type="button" aria-label="Return to the living moths" title="Return to the living moths">←</button>
        </section>
    </main>

    <dialog class="project-modal" aria-labelledby="project-title" aria-describedby="project-description">
        <article class="archive-card">
            <header class="archive-header">
                <div>
                    <p class="archive-kicker">SPECIMEN ARCHIVE <span aria-hidden="true">·</span> <span class="archive-moth-type"></span></p>
                    <h2 id="project-title"></h2>
                </div>
                <button class="archive-close" type="button" aria-label="Close project">×</button>
            </header>
            <p class="archive-year"></p>
            <div class="archive-media" aria-live="polite"></div>
            <div class="media-controls" aria-label="Project media controls">
                <button class="media-button media-previous" type="button" aria-label="Previous media">← Previous</button>
                <span class="media-count" aria-live="polite"></span>
                <button class="media-button media-next" type="button" aria-label="Next media">Next →</button>
            </div>
            <p class="archive-description" id="project-description"></p>
            <ul class="archive-tags" aria-label="Project tags"></ul>
        </article>
    </dialog>
</body>
</html>
